name: CI Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-docker:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Run sanity checks and tests
      run: |
        chmod +x tests/sanity_check.sh
        ./tests/sanity_check.sh

    - name: Build Docker image
      run: |
        docker build -t airconnect:latest .
